name: parser-ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B verify
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: mvn -B -q compile dependency:build-classpath -Dmdep.outputFile=target/cp.txt
      - name: expose java classpath to the conformance harness
        run: echo "GLMOCR_JAVA_CP=$(pwd)/target/classes:$(cat target/cp.txt)" >> "$GITHUB_ENV"
      - run: python3 tools/glmocr/conformance.py
  content-package-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/content-package-v0.1/test_proof.py
      - name: real-corpus reconstruction proof (real Revision Note + real VALIDATED QP/MS pair)
        run: python3 tools/content-package-v0.1/real_corpus/run_proof.py
